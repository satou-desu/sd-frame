<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1c">
<meta name="referrer" content="no-referrer">
<title>Schedule Dashboard</title>
<link rel="manifest" href="manifest.json">
<style>
  /* スマホのChromeで、下に引っ張ったときの再読み込みを止める */
  html, body { overscroll-behavior-y: contain; }
  html, body { margin: 0; height: 100%; background: #050b1c; color: #e6ecff;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #050b1c; }
  .setup { max-width: 420px; margin: 0 auto; padding: 48px 16px; box-sizing: border-box; }
  .setup h1 { font-size: 20px; margin: 0 0 12px; }
  .setup p { font-size: 14px; line-height: 1.7; color: #aab6d6; margin: 0 0 16px; }
  .setup input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid #2b3d6b; background: #0a1530; color: #e6ecff; }
  .setup button { margin-top: 12px; width: 100%; padding: 12px; font-size: 16px; border: 0; border-radius: 10px;
    background: #2f6bff; color: #fff; }
  .setup .err { color: #ff8a8a; font-size: 13px; min-height: 1.5em; margin-top: 8px; }
  .help { position: fixed; left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; border-radius: 10px;
    background: #0a1530; border: 1px solid #2b3d6b; font-size: 13px; display: none; z-index: 2; }
  .help a { color: #8fb1ff; margin-right: 16px; }
</style>
</head>
<body>
<script>
(function () {
  var KEY = 'sd-frame-url';
  var PATTERN = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec(\?[^\s]*)?$/;
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}

  if (!saved || !PATTERN.test(saved) || location.hash === '#setup') { showSetup(); return; }

  var frame = document.createElement('iframe');
  frame.src = saved;
  frame.title = 'Schedule Dashboard';
  frame.referrerPolicy = 'no-referrer';
  document.body.appendChild(frame);

  var help = document.createElement('div');
  help.className = 'help';
  help.innerHTML = '表示されない場合：<a id="direct" target="_top">直接開く</a><a href="#setup" id="reset">URLを設定し直す</a>';
  document.body.appendChild(help);
  help.querySelector('#direct').href = saved;
  help.querySelector('#reset').addEventListener('click', function () { setTimeout(function () { location.reload(); }, 0); });

  var timer = setTimeout(function () { help.style.display = 'block'; }, 15000);
  frame.addEventListener('load', function () { clearTimeout(timer); help.style.display = 'none'; });

  function showSetup() {
    var box = document.createElement('div');
    box.className = 'setup';
    box.innerHTML = '<h1>Schedule Dashboard</h1>' +
      '<p>ダッシュボードのURL（https://script.google.com/macros/s/…/exec?key=… の形）を貼り付けてください。' +
      'URLはこの端末のブラウザの中だけに保存され、どこにも送信されません。</p>' +
      '<input id="u" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec?key=...">' +
      '<button id="s" type="button">保存して開く</button><div class="err" id="e"></div>';
    document.body.appendChild(box);
    var input = box.querySelector('#u');
    if (saved) input.value = saved;
    box.querySelector('#s').addEventListener('click', function () {
      var v = input.value.trim();
      if (!PATTERN.test(v)) { box.querySelector('#e').textContent = 'URLの形が違います。…/exec?key=… まで含めて貼り付けてください。'; return; }
      try { localStorage.setItem(KEY, v); } catch (e) { box.querySelector('#e').textContent = '保存できませんでした（シークレットモード等）。'; return; }
      location.replace(location.pathname);
    });
  }
})();
</script>
</body>
</html>
